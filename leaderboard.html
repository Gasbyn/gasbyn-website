<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasbyn - Leaderboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f13;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #181820;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a38;
        }
        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #53fc18;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background-color: #22222e;
            color: #a0a0b0;
            font-size: 14px;
            text-transform: uppercase;
        }
        tr {
            border-bottom: 1px solid #262636;
        }
        tr:hover {
            background-color: #20202c;
        }
        .pos-1 { color: #ffd700; font-weight: bold; font-size: 1.1em; }
        .pos-2 { color: #c0c0c0; font-weight: bold; }
        .pos-3 { color: #cd7f32; font-weight: bold; }
        .points { text-align: right; font-weight: bold; color: #53fc18; }
        .platform {
            font-size: 0.75em;
            color: #888;
            margin-left: 6px;
        }
        .status {
            text-align: center;
            padding: 30px;
            color: #a0a0b0;
        }
        .error {
            color: #ff6b6b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TOP 20 LEADERBOARD</h1>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Hráč</th>
                <th style="text-align: right;">Body</th>
            </tr>
        </thead>
        <tbody id="leaderboard">
            <tr>
                <td colspan="3" class="status">Načítám žebříček...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function escapeHtml(text) {
        if (text == null) return '';
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function loadLeaderboard() {
        const tbody = document.getElementById('leaderboard');

        fetch('leaderboard.json?v=' + Date.now())
            .then(res => {
                if (!res.ok) throw new Error('Soubor leaderboard.json neexistuje nebo není dostupný (' + res.status + ')');
                return res.json();
            })
            .then(data => {
                tbody.innerHTML = '';

                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="status">Žebříček je zatím prázdný.</td></tr>';
                    return;
                }

                data.forEach(player => {
                    let posClass = '';
                    if (player.position === 1) posClass = 'pos-1';
                    else if (player.position === 2) posClass = 'pos-2';
                    else if (player.position === 3) posClass = 'pos-3';

                    const points = Number(player.points) || 0;
                    const platform = player.platform ? `<span class="platform">(${escapeHtml(player.platform)})</span>` : '';

                    const row = `
                        <tr>
                            <td class="${posClass}">#${player.position}</td>
                            <td class="${posClass}">${escapeHtml(player.name)}${platform}</td>
                            <td class="points">${points.toLocaleString('cs-CZ')}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            })
            .catch(err => {
                console.error('Chyba při načítání dat:', err);
                tbody.innerHTML = `<tr><td colspan="3" class="status error">Nepodařilo se načíst žebříček.<br><small>${escapeHtml(err.message)}</small></td></tr>`;
            });
    }

    loadLeaderboard();
    setInterval(loadLeaderboard, 30000);
</script>

</body>
</html>
