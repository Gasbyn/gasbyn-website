name: Update social stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Update data.json
        shell: python
        run: |
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          DATA = Path("data.json")

          try:
              data = json.loads(DATA.read_text(encoding="utf-8"))
          except Exception:
              data = {
                  "youtube": {"subscribers": 2000, "latestVideo": {}},
                  "kick": {"followers": 700}
              }

          def get_json(url, extra=None):
              args = ["python", "-m", "yt_dlp", "--dump-single-json", "--skip-download", "--no-warnings", "--quiet"]
              if extra:
                  args.extend(extra)
              args.append(url)
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=120)
                  if result.returncode != 0:
                      print(f"yt-dlp failed for {url}: {result.stderr[-500:]}")
                      return None
                  return json.loads(result.stdout)
              except Exception as exc:
                  print(f"Could not read {url}: {exc}")
                  return None

          now = datetime.now(timezone.utc).isoformat()

          # YouTube channel statistics + latest public upload.
          yt_channel = get_json("https://www.youtube.com/@Gasbyn")
          if yt_channel and yt_channel.get("channel_follower_count") is not None:
              data.setdefault("youtube", {})["subscribers"] = int(yt_channel["channel_follower_count"])

          yt_video = get_json(
              "https://www.youtube.com/@Gasbyn/videos",
              ["--playlist-items", "1"]
          )
          if yt_video:
              video = yt_video
              if video.get("_type") == "playlist" and video.get("entries"):
                  video = video["entries"][0]
              video_id = video.get("id")
              if video_id:
                  data.setdefault("youtube", {})["latestVideo"] = {
                      "id": video_id,
                      "title": video.get("title") or "Nejnovější video",
                      "thumbnail": video.get("thumbnail") or f"https://i.ytimg.com/vi/{video_id}/maxresdefault.jpg"
                  }

          # Kick channel follower count. Kick's public page extractor exposes the
          # current follower count without putting an API secret in the website.
          kick = get_json("https://kick.com/gasbyn")
          if kick and kick.get("channel_follower_count") is not None:
              data.setdefault("kick", {})["followers"] = int(kick["channel_follower_count"])

          data.setdefault("youtube", {})["updatedAt"] = now
          data.setdefault("kick", {})["updatedAt"] = now
          DATA.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update social stats"
          git push
