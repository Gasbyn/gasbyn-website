name: Update latest YouTube video

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check -q yt-dlp

      - name: Get latest YouTube video
        run: |
          yt-dlp --flat-playlist --playlist-end 1 --dump-single-json "https://www.youtube.com/@Gasbyn/videos" > /tmp/youtube.json

      - name: Update data.json
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          raw = json.loads(Path('/tmp/youtube.json').read_text(encoding='utf-8'))
          entries = raw.get('entries') or []
          if not entries:
              raise SystemExit('No YouTube videos found.')

          video = entries[0]
          video_id = video.get('id')
          title = video.get('title') or ''
          thumbnail = video.get('thumbnail') or (f'https://i.ytimg.com/vi/{video_id}/hqdefault.jpg' if video_id else '')

          if not video_id:
              raise SystemExit('Latest video ID was not found.')

          data_path = Path('data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data.setdefault('youtube', {})['latestVideo'] = {
              'id': video_id,
              'title': title,
              'thumbnail': thumbnail
          }
          data['youtube']['latestVideoUpdatedAt'] = datetime.now(timezone.utc).isoformat()

          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Latest video has not changed."
          else
            git commit -m "chore: update latest YouTube video"
            git push
          fi
